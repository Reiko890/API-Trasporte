spring.application.name=APITransporte

# URL de conexión (jdbc:mysql://[host]:[puerto]/[nombre_de_la_bd])
spring.datasource.url=jdbc:mysql://localhost:3306/bd_trnasporte

# Usuario de MySQL (por defecto es root)
spring.datasource.username=usuario

# Contraseña del usuario
spring.datasource.password=password123

# Driver de conexión para MySQL Connector/J
spring.datasource.driverDTO-class-name=com.mysql.cj.jdbc.Driver

# Configuración opcional de Hibernate / JPA
//spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#liquibase config
# Desactivar la generación automática de Hibernate para dar control a Liquibase
spring.jpa.hibernate.ddl-auto=none

# Habilitar Liquibase y definir la ruta del archivo maestro
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/changelog-master.xml



spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB