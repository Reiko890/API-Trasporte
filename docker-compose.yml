services:
  db:
    image: mysql:8.0
    container_name: mi_mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: bd_trnasporte
      MYSQL_USER: usuario
      MYSQL_PASSWORD: password123
      MYSQL_ROOT_PASSWORD: root_password_segura
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: